<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Mahir - Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            800: '#065f46',
                            900: '#064e3b',
                            dark: '#0b1320'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const BASE_URL = "";
    const PAGE_SIZE = 15;

    /* ---------------------------------------------------------------
       Status → color tone maps. These MUST mirror the real backend
       enums (PaymentStatus, SheikhStatus) or filters silently 400.
       PaymentStatus:  PENDING, SUCCESS, FAILED
       SheikhStatus:   DECLINED, PENDING_APPROVAL, AVAILABLE, BUSY, OFFLINE
    --------------------------------------------------------------- */
    const PAYMENT_TONE = {
        SUCCESS: 'bg-green-500/20 text-green-400',
        PENDING: 'bg-amber-500/20 text-amber-400',
        FAILED:  'bg-red-500/20 text-red-400',
    };
    const SHEIKH_TONE = {
        AVAILABLE:        'bg-green-500/20 text-green-400',
        PENDING_APPROVAL: 'bg-amber-500/20 text-amber-400',
        BUSY:              'bg-amber-500/20 text-amber-400',
        OFFLINE:           'bg-slate-600/40 text-slate-300',
        DECLINED:          'bg-red-500/20 text-red-400',
    };
    const SHEIKH_STATUS_OPTIONS = [
        { value: '', label: 'All statuses' },
        { value: 'PENDING_APPROVAL', label: 'Pending approval' },
        { value: 'AVAILABLE', label: 'Available' },
        { value: 'BUSY', label: 'Busy' },
        { value: 'OFFLINE', label: 'Offline' },
        { value: 'DECLINED', label: 'Declined' },
    ];
    const PAYMENT_STATUS_OPTIONS = [
        { value: '', label: 'All statuses' },
        { value: 'PENDING', label: 'Pending' },
        { value: 'SUCCESS', label: 'Success' },
        { value: 'FAILED', label: 'Failed' },
    ];

    function StatusBadge({ status, toneMap }) {
        const tone = toneMap[status] || 'bg-slate-600/40 text-slate-300';
        return <span className={`px-2 py-1 rounded-md text-xs font-bold ${tone}`}>{status}</span>;
    }

    function Pagination({ page, totalPages, isFirst, isLast, onChange }) {
        if (totalPages <= 1) return null;
        return (
            <div className="flex items-center justify-between px-4 py-3 text-xs text-slate-400 border-t border-slate-700/50">
                <span>Page {totalPages === 0 ? 0 : page + 1} of {totalPages}</span>
                <div className="flex gap-2">
                    <button
                        disabled={isFirst}
                        onClick={() => onChange(page - 1)}
                        className="w-7 h-7 rounded-lg border border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed hover:border-brand-500 flex items-center justify-center"
                    >‹</button>
                    <button
                        disabled={isLast}
                        onClick={() => onChange(page + 1)}
                        className="w-7 h-7 rounded-lg border border-slate-700 disabled:opacity-30 disabled:cursor-not-allowed hover:border-brand-500 flex items-center justify-center"
                    >›</button>
                </div>
            </div>
        );
    }

    function Toast({ toast }) {
        if (!toast) return null;
        const isError = toast.type === 'error';
        return (
            <div className={`fixed bottom-5 right-5 z-[100] max-w-sm px-4 py-3 rounded-xl border text-sm shadow-2xl flex items-start gap-2 ${
                isError ? 'bg-red-500/10 border-red-500/30 text-red-300' : 'bg-brand-600/10 border-brand-500/30 text-brand-300'
            }`}>
                <span>{isError ? '⚠' : '✓'}</span>
                <span>{toast.message}</span>
            </div>
        );
    }

    function App() {
        const [token, setToken] = useState(localStorage.getItem('adminToken'));
        const [currentUser, setCurrentUser] = useState(null);
        const [activeTab, setActiveTab] = useState('students');
        const [loading, setLoading] = useState(false);
        const [toast, setToast] = useState(null);

        const showToast = useCallback((message, type = 'success') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 3200);
        }, []);

        // Data States (each now paginated)
        const [students, setStudents] = useState({ content: [], page: 0, totalPages: 0, isFirst: true, isLast: true, totalElements: 0 });
        const [sheikhs, setSheikhs] = useState({ content: [], page: 0, totalPages: 0, isFirst: true, isLast: true, totalElements: 0 });
        const [payments, setPayments] = useState({ content: [], page: 0, totalPages: 0, isFirst: true, isLast: true, totalElements: 0 });

        const [sheikhFilter, setSheikhFilter] = useState('');
        const [paymentStatusFilter, setPaymentStatusFilter] = useState('');
        const [paymentUserIdFilter, setPaymentUserIdFilter] = useState('');

        // Stats (fetched independently so they reflect TOTAL counts, not just the loaded page)
        const [stats, setStats] = useState({ totalRevenue: null, pendingSheikhs: null, totalStudents: null });

        // Form States
        const [loginEmail, setLoginEmail] = useState('');
        const [loginPassword, setLoginPassword] = useState('');
        const [loginError, setLoginError] = useState('');
        const [loginLoading, setLoginLoading] = useState(false);

        // Package Modal State
        const [showPackageModal, setShowPackageModal] = useState(false);
        const [pkgSaving, setPkgSaving] = useState(false);
        const [pkgForm, setPkgForm] = useState({
            code: '', name: '', description: '', priceEgp: '',
            currencyCode: 'EGP', meetingMinutesAllowed: 120, durationDays: 30, active: true
        });

        // Fetch Helper. `isLoginCall` lets us give an accurate error message
        // instead of misreporting bad credentials as "session expired".
        const apiCall = async (endpoint, method = 'GET', body = null, isLoginCall = false) => {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch(`${BASE_URL}${endpoint}`, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });

            let data = null;
            try { data = await res.json(); } catch (e) { /* no body */ }

            if (res.status === 401 && !isLoginCall) {
                handleLogout();
                throw new Error("Your session has expired. Please log in again.");
            }

            if (!res.ok) {
                throw new Error((data && data.message) || `Request failed (${res.status})`);
            }
            return data;
        };

        // Login Handler
        const handleLogin = async (e) => {
            e.preventDefault();
            setLoginError('');
            setLoginLoading(true);
            try {
                const res = await apiCall('/api/auth/admin/login', 'POST', {
                    email: loginEmail,
                    password: loginPassword
                }, true);

                const roles = (res.data.user && res.data.user.roles) || [];
                if (!roles.includes('ADMIN')) {
                    throw new Error("This account does not have administrator access.");
                }

                const jwt = res.data.accessToken;
                localStorage.setItem('adminToken', jwt);
                setCurrentUser(res.data.user);
                setToken(jwt);
            } catch (err) {
                setLoginError(err.message);
            } finally {
                setLoginLoading(false);
            }
        };

        const handleLogout = () => {
            localStorage.removeItem('adminToken');
            setToken(null);
            setCurrentUser(null);
        };

        /* ---------------- Loaders (each independent + paginated) ---------------- */

        const loadStudents = useCallback(async (page = 0) => {
            try {
                const res = await apiCall(`/api/admin/students?page=${page}&size=${PAGE_SIZE}`);
                setStudents({ content: res.data.content, page: res.data.pageNumber, totalPages: res.data.totalPages, isFirst: res.data.isFirst, isLast: res.data.isLast, totalElements: res.data.totalElements });
            } catch (err) { showToast(err.message, 'error'); }
        }, [token]);

        const loadSheikhs = useCallback(async (page = 0, status = sheikhFilter) => {
            try {
                const qs = new URLSearchParams({ page, size: PAGE_SIZE });
                if (status) qs.set('status', status);
                const res = await apiCall(`/api/admin/sheikhs?${qs.toString()}`);
                setSheikhs({ content: res.data.content, page: res.data.pageNumber, totalPages: res.data.totalPages, isFirst: res.data.isFirst, isLast: res.data.isLast, totalElements: res.data.totalElements });
            } catch (err) { showToast(err.message, 'error'); }
        }, [token, sheikhFilter]);

        const loadPayments = useCallback(async (page = 0, status = paymentStatusFilter, userId = paymentUserIdFilter) => {
            try {
                const qs = new URLSearchParams({ page, size: PAGE_SIZE });
                if (status) qs.set('status', status);
                if (userId) qs.set('userId', userId);
                const res = await apiCall(`/api/admin/payments?${qs.toString()}`);
                setPayments({ content: res.data.content, page: res.data.pageNumber, totalPages: res.data.totalPages, isFirst: res.data.isFirst, isLast: res.data.isLast, totalElements: res.data.totalElements });
            } catch (err) { showToast(err.message, 'error'); }
        }, [token, paymentStatusFilter, paymentUserIdFilter]);

        // Lightweight KPI stats — uses totalElements from the API instead of
        // counting whatever happens to be on the currently loaded page.
        const loadStats = useCallback(async () => {
            try {
                const [studentsCount, pendingCount, successPayments] = await Promise.all([
                    apiCall(`/api/admin/students?page=0&size=1`),
                    apiCall(`/api/admin/sheikhs?status=PENDING_APPROVAL&page=0&size=1`),
                    apiCall(`/api/admin/payments?status=SUCCESS&page=0&size=100`),
                ]);
                const revenue = successPayments.data.content.reduce((acc, p) => acc + (p.amountMinorUnits || 0), 0) / 100;
                setStats({
                    totalStudents: studentsCount.data.totalElements,
                    pendingSheikhs: pendingCount.data.totalElements,
                    totalRevenue: revenue,
                    revenueIsPartial: successPayments.data.totalElements > successPayments.data.content.length,
                });
            } catch (err) { /* stats are non-critical, fail silently */ }
        }, [token]);

        useEffect(() => {
            if (!token) return;
            setLoading(true);
            Promise.all([loadStudents(0), loadSheikhs(0), loadPayments(0), loadStats()]).finally(() => setLoading(false));
        }, [token]);

        useEffect(() => { if (token) loadSheikhs(0, sheikhFilter); }, [sheikhFilter]);
        useEffect(() => { if (token) loadPayments(0, paymentStatusFilter, paymentUserIdFilter); }, [paymentStatusFilter, paymentUserIdFilter]);

        // Actions
        const toggleUserBlock = async (userId, isBlocked) => {
            try {
                await apiCall(`/api/admin/users/${userId}/${isBlocked ? 'unblock' : 'block'}`, 'POST');
                showToast(`User ${isBlocked ? 'unblocked' : 'blocked'}.`);
                loadStudents(students.page);
            } catch (err) { showToast(err.message, 'error'); }
        };

        const handleSheikhAction = async (sheikhId, action) => {
            try {
                await apiCall(`/api/admin/sheikhs/${sheikhId}/${action}`, 'POST');
                showToast(`Sheikh ${action === 'approve' ? 'approved' : 'declined'}.`);
                loadSheikhs(sheikhs.page);
                loadStats();
            } catch (err) { showToast(err.message, 'error'); }
        };

        const handleCreatePackage = async (e) => {
            e.preventDefault();
            setPkgSaving(true);
            try {
                const payload = {
                    code: pkgForm.code,
                    name: pkgForm.name,
                    description: pkgForm.description || null,
                    priceMinorUnits: Math.round(parseFloat(pkgForm.priceEgp || '0') * 100),
                    currencyCode: pkgForm.currencyCode,
                    meetingMinutesAllowed: parseInt(pkgForm.meetingMinutesAllowed || '0', 10),
                    durationDays: pkgForm.durationDays ? parseInt(pkgForm.durationDays, 10) : null,
                    active: pkgForm.active,
                };
                await apiCall('/api/admin/subscription-packages', 'POST', payload);
                setShowPackageModal(false);
                showToast('Package created successfully.');
                setPkgForm({ code: '', name: '', description: '', priceEgp: '', currencyCode: 'EGP', meetingMinutesAllowed: 120, durationDays: 30, active: true });
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                setPkgSaving(false);
            }
        };

        // Render Login View
        if (!token) {
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-brand-600/20 text-brand-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-brand-500/30">
                                <span className="text-3xl font-bold">A</span>
                            </div>
                            <h1 className="text-2xl font-bold text-white">Admin Dashboard</h1>
                            <p className="text-slate-400 text-sm mt-1">Sign in to manage Al-Mahir platform</p>
                        </div>

                        {loginError && (
                            <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-xl mb-4 text-sm text-center">
                                {loginError}
                            </div>
                        )}

                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                                <input
                                    type="email" required
                                    value={loginEmail} onChange={e => setLoginEmail(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-brand-500 transition"
                                    placeholder="admin@almahir.com"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                                <input
                                    type="password" required
                                    value={loginPassword} onChange={e => setLoginPassword(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-brand-500 transition"
                                />
                            </div>
                            <button
                                type="submit" disabled={loginLoading}
                                className="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold p-3 rounded-xl transition shadow-lg shadow-brand-600/20 disabled:opacity-60"
                            >
                                {loginLoading ? 'Authenticating...' : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Render Dashboard View
        return (
            <div className="min-h-screen flex flex-col">
                {/* Navbar */}
                <header className="bg-slate-800 border-b border-slate-700 px-4 sm:px-6 py-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center font-bold text-lg">M</div>
                        <span className="font-bold text-lg sm:text-xl text-white">Al-Mahir Admin</span>
                    </div>
                    <button onClick={handleLogout} className="bg-slate-700 hover:bg-red-600/20 hover:text-red-400 text-slate-300 text-xs sm:text-sm px-3 sm:px-4 py-2 rounded-xl transition">
                        Log Out
                    </button>
                </header>

                <div className="p-4 sm:p-6 max-w-7xl mx-auto w-full flex-1 space-y-6">
                    {/* KPI Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                            <span className="text-xs text-slate-400 block mb-1">
                                Revenue {stats.revenueIsPartial ? '(last 100 successful txns)' : '(successful)'}
                            </span>
                            <span className="text-2xl font-bold text-brand-500">
                                {stats.totalRevenue == null ? '—' : `${stats.totalRevenue.toLocaleString()} EGP`}
                            </span>
                        </div>
                        <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                            <span className="text-xs text-slate-400 block mb-1">Pending Sheikh Requests</span>
                            <span className="text-2xl font-bold text-amber-400">{stats.pendingSheikhs ?? '—'}</span>
                        </div>
                        <div className="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                            <span className="text-xs text-slate-400 block mb-1">Total Students</span>
                            <span className="text-2xl font-bold text-blue-400">{stats.totalStudents ?? '—'}</span>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="flex border-b border-slate-700 overflow-x-auto no-scrollbar gap-1 sm:gap-2">
                        {['students', 'sheikhs', 'payments'].map(tab => (
                            <button
                                key={tab}
                                onClick={() => setActiveTab(tab)}
                                className={`px-4 sm:px-5 py-3 font-semibold text-xs sm:text-sm whitespace-nowrap rounded-t-xl transition ${activeTab === tab ? 'bg-slate-800 border-t-2 border-brand-500 text-brand-500' : 'text-slate-400 hover:text-white'}`}
                            >
                                {tab === 'students' && 'Students & Users'}
                                {tab === 'sheikhs' && 'Sheikhs & Reciters'}
                                {tab === 'payments' && 'Payments & Subscriptions'}
                            </button>
                        ))}
                    </div>

                    {/* TAB 1: Students */}
                    {activeTab === 'students' && (
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-sm">
                            <div className="px-4 py-3 text-xs text-slate-400 border-b border-slate-700/50">
                                <b className="text-slate-200">{students.totalElements}</b> students
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full min-w-[650px] text-left text-sm">
                                    <thead className="bg-slate-900/50 text-slate-400">
                                    <tr>
                                        <th className="p-4">Name</th>
                                        <th className="p-4">Username</th>
                                        <th className="p-4">Email</th>
                                        <th className="p-4">Phone</th>
                                        <th className="p-4">Status</th>
                                        <th className="p-4">Action</th>
                                    </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700/50">
                                    {students.content.length === 0 && (
                                        <tr><td colSpan="6" className="p-8 text-center text-slate-500">No students found.</td></tr>
                                    )}
                                    {students.content.map(s => (
                                        <tr key={s.id} className="hover:bg-slate-700/20">
                                            <td className="p-4 font-medium whitespace-nowrap">{s.firstName} {s.lastName}</td>
                                            <td className="p-4 text-slate-400 whitespace-nowrap">@{s.username}</td>
                                            <td className="p-4 text-slate-400 whitespace-nowrap">{s.email}</td>
                                            <td className="p-4 text-slate-400 whitespace-nowrap">{s.phoneNumber || '-'}</td>
                                            <td className="p-4 whitespace-nowrap">
                                                <StatusBadge status={s.blocked ? 'Blocked' : 'Active'} toneMap={{ Blocked: 'bg-red-500/20 text-red-400', Active: 'bg-green-500/20 text-green-400' }} />
                                            </td>
                                            <td className="p-4 whitespace-nowrap">
                                                <button
                                                    onClick={() => toggleUserBlock(s.id, s.blocked)}
                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${s.blocked ? 'bg-brand-600 hover:bg-brand-500 text-white' : 'bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white'}`}
                                                >
                                                    {s.blocked ? 'Unblock' : 'Block'}
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    </tbody>
                                </table>
                            </div>
                            <Pagination page={students.page} totalPages={students.totalPages} isFirst={students.isFirst} isLast={students.isLast} onChange={loadStudents} />
                        </div>
                    )}

                    {/* TAB 2: Sheikhs */}
                    {activeTab === 'sheikhs' && (
                        <div className="space-y-4">
                            <div className="flex justify-end gap-2">
                                <select
                                    value={sheikhFilter}
                                    onChange={e => setSheikhFilter(e.target.value)}
                                    className="bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs sm:text-sm text-slate-200"
                                >
                                    {SHEIKH_STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                </select>
                            </div>
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-sm">
                                <div className="px-4 py-3 text-xs text-slate-400 border-b border-slate-700/50">
                                    <b className="text-slate-200">{sheikhs.totalElements}</b> sheikhs
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full min-w-[650px] text-left text-sm">
                                        <thead className="bg-slate-900/50 text-slate-400">
                                        <tr>
                                            <th className="p-4">Sheikh</th>
                                            <th className="p-4">Email</th>
                                            <th className="p-4">Rating</th>
                                            <th className="p-4">Status</th>
                                            <th className="p-4">Actions</th>
                                        </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/50">
                                        {sheikhs.content.length === 0 && (
                                            <tr><td colSpan="5" className="p-8 text-center text-slate-500">No sheikhs match this filter.</td></tr>
                                        )}
                                        {sheikhs.content.map(sk => (
                                            <tr key={sk.id} className="hover:bg-slate-700/20">
                                                <td className="p-4 font-medium whitespace-nowrap">{sk.firstName} {sk.lastName}</td>
                                                <td className="p-4 text-slate-400 whitespace-nowrap">{sk.email}</td>
                                                <td className="p-4 text-amber-400 whitespace-nowrap">★ {sk.rate != null ? sk.rate.toFixed(1) : 0}</td>
                                                <td className="p-4 whitespace-nowrap">
                                                    <StatusBadge status={sk.sheikhStatus} toneMap={SHEIKH_TONE} />
                                                </td>
                                                <td className="p-4 whitespace-nowrap">
                                                    {sk.sheikhStatus === 'PENDING_APPROVAL' ? (
                                                        <div className="flex gap-2">
                                                            <button
                                                                onClick={() => handleSheikhAction(sk.id, 'approve')}
                                                                className="bg-brand-600 hover:bg-brand-500 text-white px-3 py-1 rounded-lg text-xs font-bold"
                                                            >Approve</button>
                                                            <button
                                                                onClick={() => handleSheikhAction(sk.id, 'decline')}
                                                                className="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1 rounded-lg text-xs font-bold"
                                                            >Decline</button>
                                                        </div>
                                                    ) : <span className="text-slate-600 text-xs">—</span>}
                                                </td>
                                            </tr>
                                        ))}
                                        </tbody>
                                    </table>
                                </div>
                                <Pagination page={sheikhs.page} totalPages={sheikhs.totalPages} isFirst={sheikhs.isFirst} isLast={sheikhs.isLast} onChange={(p) => loadSheikhs(p)} />
                            </div>
                        </div>
                    )}

                    {/* TAB 3: Payments */}
                    {activeTab === 'payments' && (
                        <div className="space-y-4">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <h3 className="text-lg font-bold">Transaction History</h3>
                                <button
                                    onClick={() => setShowPackageModal(true)}
                                    className="bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl w-full sm:w-auto text-center"
                                >
                                    + Create Subscription Package
                                </button>
                            </div>

                            <div className="flex flex-wrap gap-2">
                                <select
                                    value={paymentStatusFilter}
                                    onChange={e => setPaymentStatusFilter(e.target.value)}
                                    className="bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs sm:text-sm text-slate-200"
                                >
                                    {PAYMENT_STATUS_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                                </select>
                                <input
                                    value={paymentUserIdFilter}
                                    onChange={e => setPaymentUserIdFilter(e.target.value)}
                                    placeholder="Filter by user ID"
                                    className="bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs sm:text-sm text-slate-200 w-56"
                                />
                            </div>

                            <div className="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-sm">
                                <div className="px-4 py-3 text-xs text-slate-400 border-b border-slate-700/50">
                                    <b className="text-slate-200">{payments.totalElements}</b> transactions
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full min-w-[650px] text-left text-sm">
                                        <thead className="bg-slate-900/50 text-slate-400">
                                        <tr>
                                            <th className="p-4">User</th>
                                            <th className="p-4">Package</th>
                                            <th className="p-4">Amount</th>
                                            <th className="p-4">Status</th>
                                            <th className="p-4">Date</th>
                                        </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/50">
                                        {payments.content.length === 0 && (
                                            <tr><td colSpan="5" className="p-8 text-center text-slate-500">No transactions found.</td></tr>
                                        )}
                                        {payments.content.map(p => (
                                            <tr key={p.transactionId} className="hover:bg-slate-700/20">
                                                <td className="p-4 whitespace-nowrap">
                                                    <div className="font-medium">{p.userFullName}</div>
                                                    <div className="text-xs text-slate-500">{p.userEmail}</div>
                                                </td>
                                                <td className="p-4 font-mono text-brand-400 whitespace-nowrap">{p.packageName} ({p.packageCode})</td>
                                                <td className="p-4 font-bold whitespace-nowrap">{(p.amountMinorUnits / 100).toFixed(2)} {p.currencyCode}</td>
                                                <td className="p-4 whitespace-nowrap">
                                                    <StatusBadge status={p.status} toneMap={PAYMENT_TONE} />
                                                    {p.status === 'FAILED' && p.failureReasonCode && (
                                                        <div className="text-[11px] text-slate-500 mt-1">{p.failureReasonCode}</div>
                                                    )}
                                                </td>
                                                <td className="p-4 text-xs text-slate-400 whitespace-nowrap">{new Date(p.createdAt).toLocaleString()}</td>
                                            </tr>
                                        ))}
                                        </tbody>
                                    </table>
                                </div>
                                <Pagination page={payments.page} totalPages={payments.totalPages} isFirst={payments.isFirst} isLast={payments.isLast} onChange={(p) => loadPayments(p)} />
                            </div>
                        </div>
                    )}
                </div>

                {/* Create Package Modal */}
                {showPackageModal && (
                    <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50 overflow-y-auto">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 my-8">
                            <div className="flex items-center justify-between">
                                <h3 className="text-lg font-bold">Create New Package</h3>
                                <button onClick={() => setShowPackageModal(false)} className="text-slate-400 hover:text-white">✕</button>
                            </div>
                            <form onSubmit={handleCreatePackage} className="space-y-3 text-xs">
                                <div>
                                    <label className="block mb-1">Package Code</label>
                                    <input required value={pkgForm.code} onChange={e=>setPkgForm({...pkgForm, code: e.target.value})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" placeholder="pkg-gold" />
                                </div>
                                <div>
                                    <label className="block mb-1">Package Name</label>
                                    <input required value={pkgForm.name} onChange={e=>setPkgForm({...pkgForm, name: e.target.value})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" placeholder="Gold Package" />
                                </div>
                                <div>
                                    <label className="block mb-1">Description (optional)</label>
                                    <input value={pkgForm.description} onChange={e=>setPkgForm({...pkgForm, description: e.target.value})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <div>
                                        <label className="block mb-1">Price ({pkgForm.currencyCode})</label>
                                        <input type="number" step="0.01" required value={pkgForm.priceEgp} onChange={e=>setPkgForm({...pkgForm, priceEgp: e.target.value})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" placeholder="150.00" />
                                    </div>
                                    <div>
                                        <label className="block mb-1">Currency Code</label>
                                        <input required maxLength={3} value={pkgForm.currencyCode} onChange={e=>setPkgForm({...pkgForm, currencyCode: e.target.value.toUpperCase()})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <div>
                                        <label className="block mb-1">Session Minutes Allowed</label>
                                        <input type="number" required value={pkgForm.meetingMinutesAllowed} onChange={e=>setPkgForm({...pkgForm, meetingMinutesAllowed: +e.target.value})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" />
                                    </div>
                                    <div>
                                        <label className="block mb-1">Duration (days)</label>
                                        <input type="number" value={pkgForm.durationDays} onChange={e=>setPkgForm({...pkgForm, durationDays: +e.target.value})} className="w-full bg-slate-900 p-2.5 rounded-lg border border-slate-700 text-white" />
                                    </div>
                                </div>
                                <label className="flex items-center gap-2 text-slate-300">
                                    <input type="checkbox" checked={pkgForm.active} onChange={e=>setPkgForm({...pkgForm, active: e.target.checked})} />
                                    Active — purchasable by customers
                                </label>
                                <div className="flex justify-end gap-2 pt-4">
                                    <button type="button" onClick={()=>setShowPackageModal(false)} className="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600">Cancel</button>
                                    <button type="submit" disabled={pkgSaving} className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 font-bold text-white disabled:opacity-60">
                                        {pkgSaving ? 'Saving…' : 'Save Package'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                <Toast toast={toast} />
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
