spring.config.import=optional:file:.env[.properties]
spring.application.name=AlMahir
# port
server.port=${PORT:8080}
#SQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.defer-datasource-initialization=true
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#Logging
logging.level.org.springframework.security=trace
logging.level.org.hibernate.jdbc.bind=trace
logging.level.com.almahir.iti=DEBUG
#JWT
jwt.access-token.expiration=86400000
jwt.refresh-token.expiration=604800000
jwt.key=${JWT_KEY}
# Google OAuth2
google.oauth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS}
#Hosting Images On Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
#Image Setting
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#Tafsir
tafsir.api.base-url=https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir
#Redis
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}
#Secret Key For Building Tafsir
admin.build.secret=${ADMIN_BUILD_SECRET}
# Admin Seed
admin.seed.username=${ADMIN_SEED_USERNAME}
admin.seed.email=${ADMIN_SEED_EMAIL}
admin.seed.password=${ADMIN_SEED_PASSWORD}
#Swagger Forward
server.forward-headers-strategy=framework
#Agora
agora.app-id=${AGORA_APP_ID}
agora.expiration-time-in-seconds=3600
agora.app-certificate=${AGORA_APP_CERTIFICATE}
#Scheduler Time For Meeting Request
meeting.request.expiration.check-delay=5000
#Paymob
paymob.base-url=https://accept.paymob.com
paymob.secret-key=${PAYMOB_SECRET_KEY}
paymob.public-key=${PAYMOB_PUBLIC_KEY}
paymob.hmac-secret=${PAYMOB_HMAC_SECRET}
paymob.integration-id.card=${PAYMOB_INTEGRATION_ID_CARD}
paymob.integration-id.wallet=${PAYMOB_INTEGRATION_ID_WALLET:}
paymob.notification-url=${APP_BASE_URL:https://almahir-production-6f98.up.railway.app}/api/payment/webhooks/paymob